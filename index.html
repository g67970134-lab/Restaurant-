<!DOCTYPE html>
<html>
<head>
    <title>My Restaurant</title>

    <style>
        h1 {
            text-align: center;
            color: red;
        }

        .tagline {
            font-size: 20px;
            color: green;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        .tagline span {
            position: absolute;
            animation: moveText 8s linear infinite;
        }

        @keyframes moveText {
            from {
                left: -100%;
            }
            to {
                left: 100%;
            }
        }
    </style>
</head>

<body>

<h1>Welcome to My Restaurant</h1>

<div class="tagline">
    <span>Delicious Food, Happy Mood 🍽️</span>
</div>

</body>
</html>
