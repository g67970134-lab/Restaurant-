<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
        }

        .login-container {
            background-color: black;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            height: 300px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: blue;
        }

        input {
            width: 75%;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            color: white;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: transparent;
            color: blue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #26c8f0;
            color: white;
            box-shadow: -4px 4px 40px #26c8f0;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Login</h2>

        <form>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">SUBMIT</button>
        </form>
    </div>

</body>
  </html>
